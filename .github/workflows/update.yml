name: Update SOCKS5 Proxy List

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and update proxies
        run: |
          curl -s "https://raw.githubusercontent.com/TuanMinPay/live-proxy/master/socks5.txt" > all.txt
          curl -s "https://api.proxyscrape.com/v3/free-proxy-list/get?request=displayproxies&protocol=socks5&proxy_format=ipport&format=text&timeout=20000" >> all.txt
          curl -s "https://raw.githubusercontent.com/ObcbO/getproxy/master/file/socks5.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/proxifly/free-proxy-list/refs/heads/main/proxies/protocols/socks5/data.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/r00tee/Proxy-List/main/Socks5.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/casals-ar/proxy-list/refs/heads/main/socks5" >> all.txt
          curl -s "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt" >> all.txt
          curl -s "https://proxyspace.pro/socks5.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/Vann-Dev/proxy-list/main/proxies/socks5.txt" >> all.txt
          curl -s "https://github.com/Anonym0usWork1221/Free-Proxies/raw/refs/heads/main/proxy_files/socks5_proxies.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/dpangestuw/Free-Proxy/refs/heads/main/socks5_proxies.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/hookzof/socks5_list/master/proxy.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/VPSLabCloud/VPSLab-Free-Proxy-List/refs/heads/main/socks5_all.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/ProxyScraper/ProxyScraper/refs/heads/main/socks5.txt" >> all.txt
          curl -s "https://www.flashproxy.com/api/proxies/txt?protocol=socks5&limit=1000" >> all.txt
          curl -s "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks5.txt" >> all.txt
          curl -s "https://github.com/proxygenerator1/ProxyGenerator/raw/refs/heads/main/Stable/socks5.txt" >> all.txt
          curl -s "https://free-proxy-list.net/" >> all.txt
          curl -s "https://raw.githubusercontent.com/vmheaven/VMHeaven.io-Free-Proxy-List/refs/heads/main/socks5.txt" >> all.txt
          grep -Eo '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}:[0-9]{2,5}' all.txt | sort -u -o all.txt
          

      - name: Commit and push updated file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          date -u > timestamp.txt
          git add all.txt timestamp.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update HTTP proxy list and keepalive timestamp" && git push)
